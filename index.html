<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Comsat Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  :root {
    --navy: #0a1f44;
    --navy-2: #0d2551;
    --navy-3: #122d61;
    --card: #ffffff;
    --card-2: #f5f7fb;
    --card-3: #e8eef7;
    --blue: #1e5fbf;
    --blue-2: #2563eb;
    --blue-light: #dbeafe;
    --blue-glow: rgba(30, 95, 191, .35);
    --text: #0f172a;
    --text-2: #475569;
    --text-3: #94a3b8;
    --white: #ffffff;
    --white-dim: rgba(255,255,255,.75);
    --white-muted: rgba(255,255,255,.5);
    --border: rgba(255,255,255,.12);
    --border-light: #e2e8f0;
    --green: #16a34a;
    --amber: #f59e0b;
    --red: #ef4444;
    --gold: #d4a017;
    --r-sm: 12px;
    --r: 18px;
    --r-lg: 24px;
  }
  html,body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--navy); color:var(--white); min-height:100vh; -webkit-font-smoothing:antialiased; }
  body { background: linear-gradient(180deg, #0a1f44 0%, #0d2551 40%, #0a1f44 100%); background-attachment:fixed; padding-bottom:env(safe-area-inset-bottom); }
  button,input,textarea,select { font-family:inherit; -webkit-appearance:none; }

  /* SPLASH */
  .splash { position:fixed; inset:0; background:var(--navy); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity .5s; }
  .splash.hide { opacity:0; pointer-events:none; }
  .splash-logo { width:100px; height:100px; animation:logoIn .8s cubic-bezier(.2,.9,.3,1.2) both; }
  .splash-name { font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700; letter-spacing:-.03em; margin-top:22px; animation:fadeUp .8s .3s both; color:#fff; }
  .splash-tag { font-size:12px; color:var(--white-dim); letter-spacing:3px; text-transform:uppercase; font-weight:600; margin-top:10px; animation:fadeUp .8s .5s both; }
  .splash-loader { position:absolute; bottom:60px; width:36px; height:3px; background:rgba(255,255,255,.15); border-radius:3px; overflow:hidden; }
  .splash-loader::after { content:''; position:absolute; inset:0; background:var(--blue-2); border-radius:3px; animation:loadBar 1.6s ease-in-out infinite; }
  @keyframes loadBar { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
  @keyframes logoIn { from{opacity:0;transform:scale(.7)} to{opacity:1;transform:scale(1)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  /* AUTH */
  .auth { min-height:100vh; max-width:440px; margin:0 auto; padding:32px 24px; display:flex; flex-direction:column; }
  .auth-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; }
  .logo-lockup { display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-.02em; color:#fff; }
  .logo-mark { width:34px; height:34px; }
  .auth-hero { margin-bottom:32px; }
  .auth-hero h2 { font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700; letter-spacing:-.035em; line-height:1.1; margin-bottom:10px; color:#fff; }
  .auth-hero p { font-size:14px; color:var(--white-dim); line-height:1.5; }
  .auth-form { display:flex; flex-direction:column; gap:14px; }
  .field label { display:block; font-size:10px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--white-muted); margin-bottom:8px; }
  .input { width:100%; padding:15px 16px; font-size:15px; font-weight:500; background:rgba(255,255,255,.06); border:1.5px solid var(--border); border-radius:var(--r-sm); color:#fff; transition:all .2s; }
  .input:focus { outline:none; border-color:var(--blue-2); box-shadow:0 0 0 4px var(--blue-glow); background:rgba(255,255,255,.1); }
  .input::placeholder { color:var(--white-muted); }
  .btn { width:100%; padding:16px; border-radius:var(--r-sm); font-size:15px; font-weight:700; border:none; cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-primary { background:linear-gradient(135deg, var(--blue), var(--blue-2)); color:#fff; box-shadow:0 10px 24px -8px var(--blue-glow); }
  .btn-owner { background:linear-gradient(135deg, var(--blue-2), #1d4ed8); color:#fff; box-shadow:0 10px 24px -8px var(--blue-glow); }
  .btn-ghost { background:rgba(255,255,255,.08); color:#fff; border:1px solid var(--border); }
  .btn-danger { background:linear-gradient(135deg, #ef4444, #dc2626); color:#fff; }
  .btn-info { background:linear-gradient(135deg, #0ea5e9, #0284c7); color:#fff; }
  .err { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.4); color:#fecaca; padding:12px 14px; border-radius:var(--r-sm); font-size:13px; text-align:center; }
  .auth-foot { margin-top:auto; text-align:center; padding-top:32px; font-size:11px; color:var(--white-muted); line-height:1.7; }
  .role-toggle { display:flex; gap:6px; background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:100px; padding:4px; margin-bottom:24px; }
  .role-toggle button { flex:1; padding:10px; border-radius:100px; border:none; background:transparent; color:var(--white-dim); font-size:12px; font-weight:700; cursor:pointer; transition:all .2s; }
  .role-toggle button.active { background:var(--blue-2); color:#fff; }

  /* APP */
  .app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  .topbar { padding:16px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:50; background:rgba(10,31,68,.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
  .topbar .who { display:flex; align-items:center; gap:11px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg, var(--blue-2), #1d4ed8); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; border:2px solid rgba(255,255,255,.15); }
  .who-text .hi { font-size:10px; color:var(--white-muted); font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .who-text .name { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; margin-top:1px; color:#fff; }
  .icon-btn { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--white-dim); }
  .icon-btn:active { transform:scale(.92); }
  .content { flex:1; padding:20px 20px 100px; }

  /* HERO */
  .hero { border-radius:var(--r-lg); padding:24px; margin-bottom:18px; position:relative; overflow:hidden; background: linear-gradient(135deg, #ffffff 0%, #f0f4fa 100%); color:var(--text); }
  .hero::before { content:''; position:absolute; top:-40%; right:-20%; width:280px; height:280px; background: radial-gradient(circle, rgba(30,95,191,.15), transparent 70%); pointer-events:none; }
  .hero.owner { background: linear-gradient(135deg, #ffffff 0%, #e8eef7 100%); }
  .hero-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; position:relative; z-index:1; }
  .hero-label { font-size:10px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-3); }
  .hero-badge { font-size:10px; font-weight:700; padding:5px 10px; border-radius:100px; background:var(--blue-light); color:var(--blue); }
  .hero-amount { font-family:'Space Grotesk',sans-serif; font-size:44px; font-weight:700; letter-spacing:-.04em; line-height:1; position:relative; z-index:1; color:var(--text); }
  .hero-amount .cur { font-size:22px; color:var(--text-2); font-weight:600; margin-right:2px; }
  .hero-split { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:22px; padding-top:18px; border-top:1px solid rgba(15,23,42,.08); position:relative; z-index:1; }
  .hero-split .k { font-size:9px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-3); margin-bottom:5px; }
  .hero-split .v { font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; color:var(--text); }
  .hero-split .v.g { color:var(--green); }
  .hero-split .v.w { color:var(--amber); }
  .hero-split .v.r { color:var(--red); }
  .hero-split .v.b { color:var(--blue); }

  /* VEHICLE CARD */
  .vehicle-card { background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:var(--r); padding:16px; margin-bottom:18px; display:flex; align-items:center; gap:14px; backdrop-filter:blur(10px); }
  .vehicle-thumb { width:64px; height:64px; border-radius:14px; background:linear-gradient(135deg, var(--blue), #1e40af); display:flex; align-items:center; justify-content:center; font-size:30px; flex-shrink:0; border:1px solid rgba(255,255,255,.15); }
  .vehicle-info { flex:1; min-width:0; }
  .vehicle-info .name { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:#fff; }
  .vehicle-info .reg { font-size:11px; color:var(--white-muted); font-weight:700; letter-spacing:1.5px; margin-top:3px; text-transform:uppercase; }
  .vehicle-info .status { display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; margin-top:8px; padding:3px 10px; border-radius:100px; background:rgba(30,95,191,.2); color:#93c5fd; border:1px solid rgba(30,95,191,.4); }
  .vehicle-info .status .d { width:5px; height:5px; border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor; }

  /* SECTIONS */
  .sec { margin-bottom:22px; }
  .sec-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:0 2px; }
  .sec-head h3 { font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700; color:#fff; }
  .sec-head .count { font-size:11px; font-weight:800; padding:3px 10px; background:linear-gradient(135deg, var(--amber), #f97316); border-radius:100px; color:#fff; }

  /* CARD */
  .card { background:var(--card); border-radius:var(--r); padding:18px; margin-bottom:12px; color:var(--text); box-shadow:0 4px 20px rgba(0,0,0,.15); }
  .card-head { display:flex; align-items:center; gap:10px; margin-bottom:16px; font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; color:var(--text); }
  .card-head .cico { width:32px; height:32px; border-radius:10px; background:var(--blue-light); color:var(--blue); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .textarea { width:100%; padding:14px 15px; font-size:13px; background:var(--card-2); border:1.5px solid var(--border-light); border-radius:var(--r-sm); color:var(--text); resize:vertical; min-height:60px; line-height:1.5; }
  .textarea:focus { outline:none; border-color:var(--blue-2); box-shadow:0 0 0 4px var(--blue-glow); }
  .card .field label { color:var(--text-2); }
  .card .input { background:var(--card-2); border:1.5px solid var(--border-light); color:var(--text); }
  .card .input:focus { border-color:var(--blue-2); box-shadow:0 0 0 4px var(--blue-glow); background:#fff; }
  .card .input::placeholder { color:var(--text-3); }
  .input.amount { font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700; letter-spacing:-.03em; padding:18px 16px; text-align:center; }

  /* BUTTONS */
  .btn-sm { padding:11px; font-size:12px; margin-top:0; }
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .btn-row .btn { margin-top:0; }

  /* ENTRY */
  .entry { background:var(--card); border-radius:var(--r); padding:16px 16px 16px 18px; margin-bottom:10px; position:relative; overflow:hidden; color:var(--text); box-shadow:0 4px 20px rgba(0,0,0,.15); }
  .entry::before { content:''; position:absolute; top:0; left:0; bottom:0; width:4px; }
  .entry.pending::before { background:var(--amber); }
  .entry.accepted::before { background:var(--green); }
  .entry.rejected::before { background:var(--red); }
  .entry-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .entry .amt { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; line-height:1; letter-spacing:-.02em; }
  .entry.pending .amt { color:var(--amber); }
  .entry.accepted .amt { color:var(--green); }
  .entry.rejected .amt { color:var(--red); }
  .entry .date { font-size:11px; color:var(--text-2); margin-top:5px; font-weight:600; }
  .tag { font-size:9px; font-weight:800; padding:4px 10px; border-radius:6px; letter-spacing:1px; text-transform:uppercase; }
  .tag.pending { background:#fef3c7; color:#92400e; }
  .tag.accepted { background:#dcfce7; color:#166534; }
  .tag.rejected { background:#fee2e2; color:#991b1b; }
  .entry .note { font-size:12px; color:var(--text-2); margin-top:10px; padding:8px 10px; background:var(--card-2); border-radius:8px; border-left:3px solid var(--border-light); line-height:1.4; }
  .entry .note.owner { border-left-color:var(--blue); color:var(--blue); background:var(--blue-light); }
  .entry .note.reject { border-left-color:var(--red); color:#991b1b; background:#fee2e2; }
  .entry .note.edit { border-left-color:var(--amber); color:#92400e; background:#fef3c7; }
  .entry .photo { margin-top:10px; border-radius:10px; overflow:hidden; max-height:200px; cursor:pointer; position:relative; }
  .entry .photo img { width:100%; display:block; }
  .entry .photo::after { content:'🔍 View'; position:absolute; top:8px; right:8px; background:rgba(0,0,0,.65); color:#fff; font-size:10px; font-weight:700; padding:4px 8px; border-radius:6px; }
  .entry-actions { display:flex; gap:6px; margin-top:12px; justify-content:flex-end; flex-wrap:wrap; }
  .entry-actions button { background:transparent; border:1px solid var(--border-light); color:var(--text-2); font-size:10px; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:700; letter-spacing:.3px; }
  .entry-actions button:active { background:var(--card-2); }
  .entry-actions .danger { color:var(--red); border-color:#fecaca; }
  .entry-actions .edit { color:var(--blue); border-color:#bfdbfe; }

  /* PENDING */
  .pending-block { background:var(--card); border-radius:var(--r); padding:18px; margin-bottom:12px; color:var(--text); box-shadow:0 4px 20px rgba(0,0,0,.15); border-left:4px solid var(--amber); }
  .pending-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .pending-head .amt { font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; line-height:1; color:var(--amber); letter-spacing:-.02em; }
  .pending-head .date { font-size:11px; color:var(--text-2); margin-top:5px; font-weight:600; }
  .pulse { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:800; letter-spacing:1.2px; color:var(--amber); text-transform:uppercase; }
  .pulse .dot { width:7px; height:7px; border-radius:50%; background:var(--amber); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  /* EMPTY */
  .empty { text-align:center; padding:36px 20px; border:1.5px dashed var(--border); border-radius:var(--r); color:var(--white-muted); font-size:13px; background:rgba(255,255,255,.02); }
  .empty .em { display:block; font-size:28px; margin-bottom:10px; opacity:.5; }

  /* BOTTOM NAV */
  .bottomnav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:rgba(10,31,68,.95); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border-top:1px solid var(--border); padding:10px 8px calc(10px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(4,1fr); z-index:100; }
  .nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; border:none; background:transparent; color:var(--white-muted); cursor:pointer; }
  .nav-item.active { color:#93c5fd; }
  .nav-item .lbl { font-size:10px; font-weight:700; }

  /* TOAST */
  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(120px); background:rgba(10,31,68,.98); color:#fff; padding:14px 22px; border-radius:100px; font-size:13px; font-weight:600; border:1px solid var(--border); transition:transform .3s; z-index:1000; pointer-events:none; max-width:90vw; text-align:center; box-shadow:0 20px 40px -10px rgba(0,0,0,.5); }
  .toast.show { transform:translateX(-50%) translateY(0); }

  /* EXPENSE */
  .exp { background:var(--card); border-radius:var(--r); padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; color:var(--text); box-shadow:0 4px 20px rgba(0,0,0,.15); }
  .exp-icon { width:42px; height:42px; border-radius:11px; background:var(--blue-light); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .exp-info { flex:1; min-width:0; }
  .exp-info .desc { font-size:14px; font-weight:700; color:var(--text); }
  .exp-info .meta { font-size:11px; color:var(--text-2); margin-top:3px; font-weight:600; }
  .exp-amt { font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; color:var(--blue); text-align:right; letter-spacing:-.02em; }
  .exp-actions { display:flex; gap:4px; margin-top:8px; justify-content:flex-end; }
  .exp-actions button { background:transparent; border:none; color:var(--text-2); font-size:11px; padding:2px 8px; cursor:pointer; font-weight:700; }
  .exp-actions .edit { color:var(--blue); }
  .exp-actions .danger { color:var(--red); }
  .exp-photo { margin-top:8px; border-radius:8px; overflow:hidden; max-height:120px; width:120px; cursor:pointer; }
  .exp-photo img { width:100%; display:block; }

  /* CHIPS */
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { padding:8px 13px; border-radius:100px; background:var(--card-2); border:1.5px solid var(--border-light); color:var(--text-2); font-size:11px; font-weight:700; cursor:pointer; }
  .chip.active { background:var(--blue-2); color:#fff; border-color:var(--blue-2); }

  /* PHOTO UPLOAD */
  .photo-upload { border:2px dashed var(--border-light); border-radius:var(--r-sm); padding:20px; text-align:center; cursor:pointer; background:var(--card-2); transition:all .2s; }
  .photo-upload:active { background:var(--blue-light); border-color:var(--blue); }
  .photo-upload .icon { font-size:26px; margin-bottom:6px; display:block; }
  .photo-upload .lbl { font-size:12px; font-weight:600; color:var(--text-2); }
  .photo-upload .sub { font-size:10px; color:var(--text-3); margin-top:3px; }
  .photo-preview { position:relative; border-radius:var(--r-sm); overflow:hidden; margin-top:8px; }
  .photo-preview img { width:100%; display:block; }
  .photo-preview .rm { position:absolute; top:8px; right:8px; background:rgba(239,68,68,.9); color:#fff; border:none; width:28px; height:28px; border-radius:50%; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  /* LIGHTBOX */
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:99999; display:flex; align-items:center; justify-content:center; padding:20px; cursor:pointer; }
  .lightbox img { max-width:100%; max-height:100%; border-radius:12px; }

  .hidden { display:none !important; }
  ::-webkit-scrollbar { width:0; height:0; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash" class="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 64 64" width="100" height="100" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e40af"/></linearGradient></defs>
      <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#lg)"/>
      <path d="M20 40h24M20 40v-6a2 2 0 012-2h2l4-8h8l4 8h2a2 2 0 012 2v6M26 40a3 3 0 11-6 0m24 0a3 3 0 11-6 0" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>
  <div class="splash-name">Comsat Fleet</div>
  <div class="splash-tag">Track · Trust · Honour</div>
  <div class="splash-loader"></div>
</div>

<!-- LOGIN -->
<div id="login" class="auth hidden">
  <div class="auth-top">
    <div class="logo-lockup">
      <svg class="logo-mark" viewBox="0 0 64 64" fill="none">
        <defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e40af"/></linearGradient></defs>
        <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#lg2)"/>
        <path d="M20 40h24M20 40v-6a2 2 0 012-2h2l4-8h8l4 8h2a2 2 0 012 2v6M26 40a3 3 0 11-6 0m24 0a3 3 0 11-6 0" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span>Comsat Fleet</span>
    </div>
  </div>
  <div class="auth-hero">
    <h2>Sign in</h2>
    <p>Choose your account and enter your password.</p>
  </div>
  <div class="role-toggle">
    <button id="rbtn_owner" onclick="setLoginRole('owner')" class="active">💼 Comsat Management</button>
    <button id="rbtn_driver" onclick="setLoginRole('driver')">🚗 Mutowa</button>
  </div>
  <div class="auth-form">
    <div class="field">
      <label id="login_label">Management password</label>
      <input id="login_pw" class="input" type="password" placeholder="Enter password">
    </div>
    <div id="login_err"></div>
    <button id="login_btn" class="btn btn-owner" onclick="doLogin()">Sign in as Management →</button>
  </div>
  <div class="auth-foot">Server-side sessions · polo.comsat.co.za</div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <div class="topbar" id="topbar">
    <div class="who">
      <div class="avatar" id="avatar">M</div>
      <div class="who-text">
        <div class="hi" id="hiText">Welcome</div>
        <div class="name" id="nameText">Mutowa</div>
      </div>
    </div>
    <button class="icon-btn" onclick="doLogout()" title="Logout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
      </svg>
    </button>
  </div>
  <div class="content" id="content"></div>
  <div class="bottomnav" id="bottomnav"></div>
</div>

<div id="toast" class="toast"></div>
<script>
// =========================================================
// CONFIG
// =========================================================
const CONFIG = {
  vehicle: { name: 'VW Polo Vivo', reg: '', icon: '🚗' },
  driver: { name: 'Mutowa', initial: 'M' },
  weeklyTarget: 1400,
  minPayment: 600,
  startDate: '2026-09-14'
};

// =========================================================
// STATE
// =========================================================
let role = null;
let tab = 'home';
let payments = [];
let expenses = [];
let totals = { accepted: 0, pending: 0 };
let expenseTotal = 0;
let loginRole = 'owner';
let pollTimer = null;
let selectedCategory = 'repairs';
let pendingPhotoUrl = '';
let editingPaymentId = null;

// =========================================================
// API
// =========================================================
async function api(url, opts = {}) {
  const r = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    ...opts
  });
  return r.json();
}
function apiGet(url, action) { return api(url + '?action=' + action); }
function apiPost(url, action, body) {
  return api(url + '?action=' + action, { method: 'POST', body: JSON.stringify(body) });
}
function payGet(a) { return apiGet('payments.php', a); }
function payPost(a, b) { return apiPost('payments.php', a, b); }
function expGet(a) { return apiGet('expenses.php', a); }
function expPost(a, b) { return apiPost('expenses.php', a, b); }

// =========================================================
// BOOT
// =========================================================
window.addEventListener('load', () => {
  setTimeout(async () => {
    document.getElementById('splash').classList.add('hide');
    setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 500);
    await checkSession();
  }, 1400);
});

async function checkSession() {
  const res = await api('me.php');
  if (res.ok && res.role) {
    role = res.role;
    await loadAll();
    show('app');
    renderApp();
    startPolling();
  } else {
    setLoginRole('owner');
    show('login');
  }
}

function show(id) {
  ['login','app'].forEach(x => document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// =========================================================
// LOGIN / LOGOUT
// =========================================================
function setLoginRole(r) {
  loginRole = r;
  document.getElementById('rbtn_owner').classList.toggle('active', r === 'owner');
  document.getElementById('rbtn_driver').classList.toggle('active', r === 'driver');
  document.getElementById('login_label').textContent = r === 'owner' ? 'Management password' : 'Driver password';
  const btn = document.getElementById('login_btn');
  btn.textContent = r === 'owner' ? 'Sign in as Management →' : 'Sign in as Mutowa →';
  btn.className = 'btn ' + (r === 'owner' ? 'btn-owner' : 'btn-primary');
  document.getElementById('login_pw').value = '';
  document.getElementById('login_err').innerHTML = '';
}

async function doLogin() {
  const pw = document.getElementById('login_pw').value;
  document.getElementById('login_err').innerHTML = '';
  if (!pw) return showLoginErr('Please enter your password.');

  const btn = document.getElementById('login_btn');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const res = await api('login.php', {
      method: 'POST',
      body: JSON.stringify({ role: loginRole, password: pw })
    });

    if (!res.ok) {
      showLoginErr(res.error || 'Login failed');
      btn.disabled = false;
      btn.textContent = loginRole === 'owner' ? 'Sign in as Management →' : 'Sign in as Mutowa →';
      return;
    }
    role = res.role;
    await loadAll();
    toast(`✅ Welcome, ${role === 'owner' ? 'Management' : 'Mutowa'}`);
    show('app');
    renderApp();
    startPolling();
  } catch (e) {
    showLoginErr('Network error');
    btn.disabled = false;
  }
}

function showLoginErr(msg) {
  document.getElementById('login_err').innerHTML = `<div class="err">${msg}</div>`;
}

async function doLogout() {
  if (!confirm('Log out?')) return;
  await api('logout.php');
  stopPolling();
  role = null; payments = []; expenses = []; totals = { accepted:0, pending:0 }; expenseTotal = 0;
  document.getElementById('login_pw').value = '';
  document.getElementById('login_err').innerHTML = '';
  setLoginRole('owner');
  show('login');
}

// =========================================================
// DATA
// =========================================================
async function loadAll() {
  await loadPayments();
  await loadExpenses();
}

async function loadPayments() {
  const res = await payGet('list');
  if (res.ok) {
    payments = res.payments || [];
    totals = { accepted: res.total_accepted || 0, pending: res.total_pending || 0 };
    return true;
  }
  if (res.error === 'Not authenticated') { stopPolling(); show('login'); }
  return false;
}

async function loadExpenses() {
  const res = await expGet('list');
  if (res.ok) {
    expenses = res.expenses || [];
    expenseTotal = res.total || 0;
    return true;
  }
  return false;
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    const ok = await loadAll();
    if (ok) { renderContent(); renderNav(); }
  }, 15000);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// =========================================================
// RENDER
// =========================================================
function renderApp() {
  const tb = document.getElementById('topbar');
  const av = document.getElementById('avatar');
  const hi = document.getElementById('hiText');
  const nm = document.getElementById('nameText');

  if (role === 'owner') {
    tb.classList.add('owner'); av.textContent = 'M';
    hi.textContent = 'Welcome back'; nm.textContent = 'Comsat Management';
  } else {
    tb.classList.remove('owner'); av.textContent = 'M';
    hi.textContent = 'Welcome'; nm.textContent = 'Mutowa';
  }
  renderContent(); renderNav();
}

function renderContent() {
  const el = document.getElementById('content');
  if (role === 'owner') {
    if (tab === 'home') el.innerHTML = ownerHome();
    else if (tab === 'pay') el.innerHTML = ownerReceive();
    else if (tab === 'costs') el.innerHTML = costsView();
    else el.innerHTML = ownerProfile();
  } else {
    if (tab === 'home') el.innerHTML = driverHome();
    else if (tab === 'pay') el.innerHTML = driverSubmitView();
    else if (tab === 'costs') el.innerHTML = costsView();
    else el.innerHTML = driverProfile();
    const d = document.getElementById('f_date');
    if (d && !d.value) d.valueAsDate = new Date();
  }
  window.scrollTo(0, 0);
}

function renderNav() {
  const nav = document.getElementById('bottomnav');
  const items = role === 'owner'
    ? [['home','Home','M3 12l9-9 9 9v9a2 2 0 01-2 2h-4v-6H9v6H5a2 2 0 01-2-2z'],
       ['pay','Receive','M21 12a9 9 0 11-18 0 9 9 0 0118 0zM12 7v10M8 12h8'],
       ['costs','Costs','M12 2l3 7h7l-5.5 4.5L18 21l-6-3.5L6 21l1.5-7.5L2 9h7z'],
       ['profile','Profile','M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z']]
    : [['home','Home','M3 12l9-9 9 9v9a2 2 0 01-2 2h-4v-6H9v6H5a2 2 0 01-2-2z'],
       ['pay','Pay','M12 5v14M5 12h14'],
       ['costs','Car','M5 17h14M5 17a2 2 0 01-2-2v-4l2-4h14l2 4v4a2 2 0 01-2 2M7 17v2M17 17v2'],
       ['profile','Profile','M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z']];

  nav.innerHTML = items.map(([key, label, path]) => `
    <button class="nav-item ${tab === key ? 'active' : ''}" onclick="setTab('${key}')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="${path}"/>
      </svg>
      <span class="lbl">${label}</span>
    </button>
  `).join('');
}

function setTab(t) { tab = t; renderContent(); renderNav(); }

// =========================================================
// VEHICLE CARD
// =========================================================
function vehicleCard() {
  const regLine = CONFIG.vehicle.reg ? `<div class="reg">${CONFIG.vehicle.reg}</div>` : '';
  return `
    <div class="vehicle-card">
      <div class="vehicle-thumb">${CONFIG.vehicle.icon}</div>
      <div class="vehicle-info">
        <div class="name">${CONFIG.vehicle.name}</div>
        ${regLine}
        <div class="status"><span class="d"></span>Active · Weekly R${CONFIG.weeklyTarget.toLocaleString()}</div>
      </div>
    </div>
  `;
}

// =========================================================
// DRIVER VIEWS
// =========================================================
function driverHome() {
  const recent = payments.slice(0, 3);
  const thisWeek = getThisWeekPayments();
  const weekPaid = thisWeek.reduce((s,p) => s + Number(p.amount), 0);
  const weekStatus = weekPaid >= CONFIG.weeklyTarget ? { label: '✅ Complete', cls: 'g' }
    : weekPaid >= CONFIG.minPayment ? { label: '⚠️ Partial', cls: 'w' }
    : { label: '❌ Not paid', cls: 'r' };

  return `
    <div class="hero">
      <div class="hero-top">
        <div class="hero-label">Paid to date</div>
        <div class="hero-badge">Live</div>
      </div>
      <div class="hero-amount"><span class="cur">R</span>${totals.accepted.toLocaleString()}</div>
      <div class="hero-split">
        <div><div class="k">This week</div><div class="v ${weekStatus.cls}">${weekStatus.label}</div></div>
        <div><div class="k">Weekly target</div><div class="v">R${CONFIG.weeklyTarget.toLocaleString()}</div></div>
      </div>
    </div>
    ${vehicleCard()}
    <div class="sec">
      <div class="sec-head">
        <h3>Recent activity</h3>
        <button class="icon-btn" style="width:auto;padding:4px 12px;font-size:12px;font-weight:700" onclick="setTab('pay')">Submit →</button>
      </div>
      ${recent.length === 0
        ? '<div class="empty"><span class="em">📭</span>No payments yet — tap Submit to add one</div>'
        : recent.map(entryHtml).join('')}
    </div>
  `;
}

function driverSubmitView() {
  return `
    <div class="sec">
      <div class="sec-head"><h3>Submit a payment</h3></div>
      <div class="card">
        <div class="field">
          <label>Amount (R) — minimum R${CONFIG.minPayment}</label>
          <input id="f_amount" class="input amount" type="number" inputmode="numeric" placeholder="0" autocomplete="off">
        </div>
        <div class="field">
          <label>Date</label>
          <input id="f_date" class="input" type="date">
        </div>
        <div class="field">
          <label>Reference / Note</label>
          <textarea id="f_note" class="textarea" placeholder="e.g. EFT ref 8821, cash at garage"></textarea>
        </div>
        <div class="field">
          <label>Proof of payment (optional)</label>
          <div class="photo-upload" onclick="document.getElementById('f_photo').click()">
            <span class="icon">📷</span>
            <span class="lbl">Tap to add a screenshot or photo</span>
            <span class="sub">Max 2 MB · JPG, PNG, WEBP</span>
          </div>
          <input id="f_photo" type="file" accept="image/*" style="display:none" onchange="handlePhotoUpload(this, 'f_preview')">
          <div id="f_preview"></div>
        </div>
        <button class="btn btn-primary" onclick="driverSubmit()">✓ Submit for approval</button>
      </div>
    </div>
    <div class="sec">
      <div class="sec-head"><h3>All submissions</h3></div>
      ${payments.length === 0
        ? '<div class="empty"><span class="em">📭</span>Nothing yet</div>'
        : payments.map(entryHtml).join('')}
    </div>
  `;
}

function driverProfile() {
  return `
    ${vehicleCard()}
    <div class="card">
      <div class="card-head"><span class="cico">👤</span> Mutowa</div>
      <div style="font-size:13px;color:var(--text-2);line-height:1.7">
        Driver since September 2026<br>
        Weekly target R${CONFIG.weeklyTarget.toLocaleString()} · Minimum R${CONFIG.minPayment}<br>
        Vehicle: ${CONFIG.vehicle.name}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="cico">🔄</span> Live Sync</div>
      <p style="font-size:13px;color:var(--text-2);line-height:1.6">Your payments go straight to Comsat Management. Refresh happens automatically every 15 seconds.</p>
    </div>
  `;
}

// =========================================================
// OWNER VIEWS
// =========================================================
function ownerHome() {
  const pending = payments.filter(p => p.status === 'pending');
  const recent = payments.filter(p => p.status !== 'pending').slice(0, 5);
  const net = totals.accepted - expenseTotal;

  return `
    <div class="hero owner">
      <div class="hero-top">
        <div class="hero-label">Net Position</div>
        <div class="hero-badge">${pending.length} Pending</div>
      </div>
      <div class="hero-amount"><span class="cur">R</span>${net.toLocaleString()}</div>
      <div class="hero-split">
        <div><div class="k">Received</div><div class="v g">R${totals.accepted.toLocaleString()}</div></div>
        <div><div class="k">Car spent</div><div class="v b">R${expenseTotal.toLocaleString()}</div></div>
      </div>
    </div>
    ${vehicleCard()}
    ${pending.length > 0 ? `
      <div class="sec">
        <div class="sec-head"><h3>Needs your approval</h3><span class="count">${pending.length}</span></div>
        ${pending.map(pendingBlockHtml).join('')}
      </div>
    ` : ''}
    <div class="sec">
      <div class="sec-head"><h3>Recent decisions</h3></div>
      ${recent.length === 0
        ? '<div class="empty"><span class="em">📒</span>No processed payments yet</div>'
        : recent.map(entryHtml).join('')}
    </div>
  `;
}

function ownerReceive() {
  return `
    <div class="sec">
      <div class="sec-head"><h3>Live incoming</h3></div>
      <div class="card">
        <div class="card-head"><span class="cico">📡</span> Real-time sync</div>
        <p style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:12px">
          Mutowa's submissions appear here automatically every 15 seconds.
        </p>
        <button class="btn btn-ghost btn-sm" onclick="refreshNow()" style="color:var(--text)">🔄 Refresh now</button>
      </div>
    </div>
    <div class="sec">
      <div class="sec-head"><h3>All payments</h3></div>
      ${payments.length === 0
        ? '<div class="empty"><span class="em">📭</span>No payments yet</div>'
        : payments.map(entryHtml).join('')}
    </div>
  `;
}

function ownerProfile() {
  const net = totals.accepted - expenseTotal;
  return `
    ${vehicleCard()}
    <div class="card">
      <div class="card-head"><span class="cico">💰</span> Money summary</div>
      <div style="display:grid;gap:12px;font-size:14px">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="color:var(--text-2)">Received from driver</span><strong style="color:var(--green);font-family:'Space Grotesk'">R${totals.accepted.toLocaleString()}</strong></div>
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="color:var(--text-2)">Spent on vehicle</span><strong style="color:var(--blue);font-family:'Space Grotesk'">R${expenseTotal.toLocaleString()}</strong></div>
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-light);padding-top:12px"><span style="font-weight:700">Net position</span><strong style="color:${net>=0?'var(--green)':'var(--red)'};font-family:'Space Grotesk';font-size:17px">R${net.toLocaleString()}</strong></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="cico">🏠</span> Agreement</div>
      <div style="font-size:13px;color:var(--text-2);line-height:1.7">
        Vehicle: ${CONFIG.vehicle.name}<br>
        Driver: Mutowa<br>
        Weekly: R${CONFIG.weeklyTarget.toLocaleString()} · Minimum: R${CONFIG.minPayment}<br>
        Start: ${CONFIG.startDate}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="cico">🔒</span> Security</div>
      <p style="font-size:13px;color:var(--text-2);line-height:1.6">Server sessions · bcrypt hashed · HTTPS enforced · All edits tracked.</p>
    </div>
  `;
}

// =========================================================
// COSTS VIEW (shared between owner and driver)
// =========================================================
function costsView() {
  const cats = ['service','tyres','fuel','repairs','licence','insurance','other'];
  const labels = { service:'Service', tyres:'Tyres', fuel:'Fuel', repairs:'Repairs', licence:'Licence', insurance:'Insurance', other:'Other' };
  const icons = { service:'🛠️', tyres:'🛞', fuel:'⛽', repairs:'🔧', licence:'📄', insurance:'🛡️', other:'💼' };
  const canEdit = (role === 'owner');

  return `
    <div class="hero ${role === 'owner' ? 'owner' : ''}">
      <div class="hero-top">
        <div class="hero-label">Total spent on car</div>
        <div class="hero-badge">${expenses.length} entries</div>
      </div>
      <div class="hero-amount"><span class="cur">R</span>${expenseTotal.toLocaleString()}</div>
      <div class="hero-split">
        <div><div class="k">Vehicle</div><div class="v">${CONFIG.vehicle.name}</div></div>
        <div><div class="k">Submitted by</div><div class="v">Both</div></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>Log an expense</h3></div>
      <div class="card">
        <div class="field">
          <label>Amount (R)</label>
          <input id="e_amount" class="input amount" type="number" inputmode="numeric" placeholder="0">
        </div>
        <div class="field">
          <label>Date</label>
          <input id="e_date" class="input" type="date">
        </div>
        <div class="field">
          <label>Category</label>
          <div class="chips" id="e_chips">
            ${cats.map(c => `<button class="chip ${c===selectedCategory?'active':''}" data-cat="${c}" onclick="pickCategory('${c}')">${icons[c]} ${labels[c]}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="e_desc" class="textarea" placeholder="e.g. Front brake pads replaced at Hi-Q"></textarea>
        </div>
        <div class="field">
          <label>Receipt (optional)</label>
          <div class="photo-upload" onclick="document.getElementById('e_photo').click()">
            <span class="icon">📷</span>
            <span class="lbl">Tap to add a photo of the receipt</span>
            <span class="sub">Max 2 MB · JPG, PNG, WEBP</span>
          </div>
          <input id="e_photo" type="file" accept="image/*" style="display:none" onchange="handlePhotoUpload(this, 'e_preview')">
          <div id="e_preview"></div>
        </div>
        <button class="btn btn-primary" onclick="saveExpense()">＋ Add expense</button>
      </div>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>Fixed this</h3></div>
      ${expenses.length === 0
        ? '<div class="empty"><span class="em">🔧</span>No costs logged yet</div>'
        : expenses.map(e => expenseHtml(e, canEdit)).join('')}
    </div>
  `;
}

// =========================================================
// ENTRY HTML
// =========================================================
function entryHtml(p) {
  const d = (p.pay_date || '').slice(0, 10);
  const canEdit = role === 'owner';
  const canCancel = role === 'driver' && p.status === 'pending';
  const photo = p.photo_url || p.proof_url;
  return `
    <div class="entry ${p.status}">
      <div class="entry-top">
        <div>
          <div class="amt">R${Number(p.amount).toLocaleString()}</div>
          <div class="date">${fmtDate(d)}</div>
        </div>
        <span class="tag ${p.status}">${p.status}</span>
      </div>
      ${p.note ? `<div class="note">📝 ${esc(p.note)}</div>` : ''}
      ${p.owner_note ? `<div class="note owner">💼 ${esc(p.owner_note)}</div>` : ''}
      ${p.reject_reason ? `<div class="note reject">❌ ${esc(p.reject_reason)}</div>` : ''}
      ${p.edit_reason ? `<div class="note edit">✎ Edited: ${esc(p.edit_reason)}</div>` : ''}
      ${photo ? `<div class="photo" onclick="viewPhoto('${photo}')"><img src="${photo}" alt="Proof"></div>` : ''}
      ${(canEdit || canCancel) ? `
        <div class="entry-actions">
          ${canEdit ? `<button class="edit" onclick="editPayment(${p.id})">✎ Edit</button>` : ''}
          ${canEdit ? `<button class="danger" onclick="deletePayment(${p.id})">🗑 Delete</button>` : ''}
          ${canCancel ? `<button class="danger" onclick="cancelOwnPayment(${p.id})">✕ Cancel</button>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

function pendingBlockHtml(p) {
  const d = (p.pay_date || '').slice(0, 10);
  const amt = Number(p.amount);
  const ok = amt >= CONFIG.minPayment;
  const photo = p.photo_url || p.proof_url;
  return `
    <div class="pending-block">
      <div class="pending-head">
        <div>
          <div class="amt">R${amt.toLocaleString()}</div>
          <div class="date">${fmtDate(d)}</div>
        </div>
        <div class="pulse"><span class="dot"></span>Pending</div>
      </div>
      ${p.note ? `<div class="note" style="font-size:13px;color:var(--text-2);margin-bottom:12px;padding:10px;background:var(--card-2);border-radius:8px">📝 ${esc(p.note)}</div>` : ''}
      ${photo ? `<div class="photo" style="margin-bottom:12px" onclick="viewPhoto('${photo}')"><img src="${photo}" alt="Proof"></div>` : ''}
      <div class="btn-row">
        <button class="btn btn-primary" onclick="ownerAccept(${p.id})" ${!ok?'disabled':''}>${ok?'✓ Accept':'Below R'+CONFIG.minPayment}</button>
        <button class="btn btn-danger" onclick="ownerReject(${p.id})">✕ Reject</button>
      </div>
    </div>
  `;
}

function expenseHtml(e, canEdit) {
  const icons = { service:'🛠️', tyres:'🛞', fuel:'⛽', repairs:'🔧', licence:'📄', insurance:'🛡️', other:'💼' };
  return `
    <div class="exp">
      <div class="exp-icon">${icons[e.category]||'💼'}</div>
      <div class="exp-info">
        <div class="desc">${esc(e.description) || e.category}</div>
        <div class="meta">${fmtDate(e.exp_date)} · ${e.category}</div>
        ${e.photo_url ? `<div class="exp-photo" onclick="viewPhoto('${e.photo_url}')"><img src="${e.photo_url}" alt="Receipt"></div>` : ''}
        ${canEdit ? `
          <div class="exp-actions">
            <button class="edit" onclick="editExpense(${e.id})">✎ Edit</button>
            <button class="danger" onclick="deleteExpense(${e.id})">🗑 Delete</button>
          </div>
        ` : ''}
      </div>
      <div class="exp-amt">R${Number(e.amount).toLocaleString()}</div>
    </div>
  `;
}

// =========================================================
// PHOTO UPLOAD
// =========================================================
async function handlePhotoUpload(input, previewId) {
  const file = input.files[0];
  if (!file) return;

  if (file.size > 2 * 1024 * 1024) {
    toast('⚠️ Photo too large. Max 2 MB.');
    input.value = '';
    return;
  }

  const fd = new FormData();
  fd.append('photo', file);

  toast('📤 Uploading...');

  try {
    const r = await fetch('upload.php', {
      method: 'POST',
      body: fd,
      credentials: 'same-origin'
    });
    const j = await r.json();
    if (!j.ok) {
      toast('❌ ' + (j.error || 'Upload failed'));
      return;
    }
    pendingPhotoUrl = j.url;
    const preview = document.getElementById(previewId);
    preview.innerHTML = `
      <div class="photo-preview">
        <img src="${j.url}" alt="Preview">
        <button class="rm" onclick="clearPhoto('${previewId}')">✕</button>
      </div>
    `;
    toast('✅ Photo ready');
  } catch (e) {
    toast('❌ Upload error');
  }
}

function clearPhoto(previewId) {
  pendingPhotoUrl = '';
  document.getElementById(previewId).innerHTML = '';
}

function viewPhoto(url) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.onclick = () => lb.remove();
  lb.innerHTML = `<img src="${url}" alt="Photo">`;
  document.body.appendChild(lb);
}

// =========================================================
// DRIVER ACTIONS
// =========================================================
async function driverSubmit() {
  const amountEl = document.getElementById('f_amount');
  const dateEl   = document.getElementById('f_date');
  const noteEl   = document.getElementById('f_note');

  const amount = parseFloat(amountEl.value);
  const date   = dateEl.value;
  const note   = noteEl.value.trim();

  if (!amount || amount < CONFIG.minPayment) {
    toast('⚠️ Minimum is R' + CONFIG.minPayment); amountEl.focus(); return;
  }
  if (!date) { toast('⚠️ Pick a date'); dateEl.focus(); return; }

  const res = await payPost('create', { amount, date, note, photo_url: pendingPhotoUrl });
  if (!res.ok) { toast('❌ ' + (res.error || 'Failed')); return; }

  toast('✅ Submitted! Management will see it shortly.');
  pendingPhotoUrl = '';
  await loadPayments();
  setTimeout(() => setTab('home'), 600);
}

async function cancelOwnPayment(id) {
  if (!confirm('Cancel this pending payment? It will be removed.')) return;
  const res = await payPost('cancel', { id });
  if (!res.ok) { toast('❌ ' + (res.error || 'Failed')); return; }
  toast('✓ Cancelled');
  await loadPayments();
  renderContent();
}

// =========================================================
// OWNER PAYMENT ACTIONS
// =========================================================
async function ownerAccept(id) {
  const note = prompt('Add a note (optional):', '');
  if (note === null) return;
  const res = await payPost('decide', { id, status: 'accepted', owner_note: note.trim() });
  if (!res.ok) { toast('❌ ' + (res.error || 'Failed')); return; }
  toast('✅ Accepted');
  await loadPayments(); renderContent();
}

async function ownerReject(id) {
  const reason = prompt('Reason for rejecting:', '');
  if (reason === null) return;
  const res = await payPost('decide', { id, status: 'rejected', reject_reason: reason.trim() || 'No reason given' });
  if (!res.ok) { toast('❌ ' + (res.error || 'Failed')); return; }
  toast('❌ Rejected');
  await loadPayments(); renderContent();
}

async function editPayment(id) {
  const p = payments.find(x => x.id === id);
  if (!p) return;
  const amt = prompt('New amount (R):', p.amount);
  if (amt === null) return;
  const newAmt = parseFloat(amt);
  if (!newAmt || newAmt < CONFIG.minPayment) { toast('⚠️ Minimum R' + CONFIG.minPayment); return; }

  const d = prompt('New date (YYYY-MM-DD):', (p.pay_date || '').slice(0,10));
  if (d === null) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('⚠️ Invalid date'); return; }

  const n = prompt('New note:', p.note || '');
  if (n === null) return;

  const reason = prompt('Reason for edit (audit log):', 'Correction');
  if (reason === null) return;

  const res = await payPost('edit', { id, amount: newAmt, date: d, note: n.trim(), edit_reason: reason.trim() || 'Correction' });
  if (!res.ok) { toast('❌ ' + (res.error || 'Failed')); return; }
  toast('✎ Updated');
  await loadPayments(); renderContent();
}

async function deletePayment(id) {
  const p = payments.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`Delete payment R${Number(p.amount).toLocaleString()} permanently?\n\nThis cannot be undone.`)) return;
  const res = await payPost('delete', { id });
  if (!res.ok) { toast('❌ ' + (res.error || 'Failed')); return; }
  toast('🗑 Deleted');
  await loadPayments(); renderContent();
}

// =========================================================
// EXPENSE ACTIONS
// =========================================================
function pickCategory(c) {
  selectedCategory = c;
  document.querySelectorAll('#e_chips .chip').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`#e_chips .chip[data-cat="${c}"]`);
  if (el) el.classList.add('active');
}

async function saveExpense() {
  const amountEl = document.getElementById('e_amount');
  const dateEl   = document.getElementById('e_date');
  const descEl   = document.getElementById('e_desc');

  const amount = parseFloat(amountEl.value);
  const date   = dateEl.value;
  const desc   = descEl.value.trim();

  if (!amount || amount <= 0) { toast('⚠️ Enter a valid amount'); amountEl.focus(); return; }
  if (!date) { toast('⚠️ Pick a date'); dateEl.focus(); return; }

  const res = await expPost('create', { amount, date, category: selectedCategory, description: desc, photo_url: pendingPhotoUrl });
  if (!res.ok) { toast('❌ ' + (res.error || 'Failed')); return; }

  toast('✅ Expense added');
  pendingPhotoUrl = '';
  selectedCategory = 'repairs';
  await loadExpenses();
  renderContent();
}

async function editExpense(id) {
  const e = expenses.find(x => x.id === id);
  if (!e) return;
  const amt = prompt('New amount (R):', e.amount);
  if (amt === null) return;
  const newAmt = parseFloat(amt);
  if (!newAmt || newAmt <= 0) { toast('⚠️ Invalid amount'); return; }

  const d = prompt('New date (YYYY-MM-DD):', (e.exp_date || '').slice(0,10));
  if (d === null) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('⚠️ Invalid date'); return; }

  const desc = prompt('New description:', e.description || '');
  if (desc === null) return;

  const res = await expPost('update', { id, amount: newAmt, date: d, category: e.category, description: desc.trim() });
  if (!res.ok) { toast('❌ ' + (res.error || 'Failed')); return; }
  toast('✎ Updated');
  await loadExpenses(); renderContent();
}

async function deleteExpense(id) {
  const e = expenses.find(x => x.id === id);
  if (!e) return;
  if (!confirm(`Delete this expense of R${Number(e.amount).toLocaleString()}?`)) return;
  const res = await expPost('delete', { id });
  if (!res.ok) { toast('❌ ' + (res.error || 'Failed')); return; }
  toast('🗑 Deleted');
  await loadExpenses(); renderContent();
}

// =========================================================
// HELPERS
// =========================================================
function getThisWeekPayments() {
  const now = new Date();
  const day = now.getDay();
  const diffToMon = (day === 0 ? -6 : 1 - day);
  const mon = new Date(now); mon.setDate(now.getDate() + diffToMon); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
  return payments.filter(p => {
    if (p.status !== 'accepted') return false;
    const d = new Date(p.pay_date + 'T00:00:00');
    return d >= mon && d <= sun;
  });
}

async function refreshNow() {
  await loadAll();
  renderContent();
  toast('🔄 Refreshed');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
